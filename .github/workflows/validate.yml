name: validate

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar traducciones y regenerar el bundle
        run: |
          node scripts/build-pack.js --check
          node scripts/build-pack.js
          git diff --exit-code -- lib/client.js
